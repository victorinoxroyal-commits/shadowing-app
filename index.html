<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Shadowing App</title>
  
  <!-- Configuración PWA / Modo App Pantalla Completa en iOS y Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shadowing App">
  <meta name="theme-color" content="#121212">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      text-align: center;
      margin-top: 10px;
    }

    h1 {
      font-size: 1.4rem;
      color: #00d2ff;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a0a0a0;
    }

    .category-select {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #1e1e1e;
      color: #00d2ff;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    .display-card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid #2a2a2a;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .phrase-en {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .phrase-es {
      font-size: 1.1rem;
      color: #8e8e93;
      font-weight: 400;
    }

    .controls-panel {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 5px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #00d2ff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-play {
      background-color: #00d2ff;
      color: #000000;
      grid-column: span 2;
    }

    .btn-next {
      background-color: #2c2c2e;
      color: #ffffff;
    }

    .btn-stop {
      background-color: #ff3b30;
      color: #ffffff;
    }

    .btn-active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Shadowing Hands-Free</h1>
    <p class="subtitle">Práctica oral de inglés en bucle</p>
    
    <select id="categorySelect" class="category-select" onchange="changeCategory()">
      <option value="daily">Frases Cotidianas / Trabajo</option>
      <option value="driving">Conducción y Entrega</option>
      <option value="conversation">Conversación Fluida</option>
    </select>
  </header>

  <main class="display-card">
    <div id="phraseEn" class="phrase-en">Presiona reproducir para iniciar</div>
    <div id="phraseEs" class="phrase-es">Press play to start</div>
  </main>

  <section class="controls-panel">
    <div class="control-group">
      <div class="control-label">
        <span>Velocidad de voz</span>
        <span id="rateValue">0.85x</span>
      </div>
      <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.85" oninput="updateRateLabel(this.value)">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Pausa entre repeticiones</span>
        <span id="delayValue">2.5s</span>
      </div>
      <input type="range" id="delay" min="1" max="6" step="0.5" value="2.5" oninput="updateDelayLabel(this.value)">
    </div>
  </section>

  <footer class="actions">
    <button id="btnPlay" class="btn-play" onclick="togglePlay()">Reproducir en Bucle</button>
    <button class="btn-next" onclick="nextPhrase()">Siguiente</button>
    <button class="btn-stop" onclick="stopAudio()">Detener</button>
